name: Build and Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build and pack
        run: |
          pnpm run pack
          ls -la packaged/
          test -s packaged/asuswrt-merlin-stealthsurf.tar.gz
          tar -tzf packaged/asuswrt-merlin-stealthsurf.tar.gz | head -20
          rm -rf /tmp/ss-rel-pkg && mkdir -p /tmp/ss-rel-pkg
          tar -xzf packaged/asuswrt-merlin-stealthsurf.tar.gz -C /tmp/ss-rel-pkg
          test -x /tmp/ss-rel-pkg/stealthsurf/stealthsurf
          test -f /tmp/ss-rel-pkg/stealthsurf/index.asp
          test -f /tmp/ss-rel-pkg/stealthsurf/app.js

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: asuswrt-merlin-stealthsurf
          path: packaged/asuswrt-merlin-stealthsurf.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: asuswrt-merlin-stealthsurf
          path: packaged

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: packaged/asuswrt-merlin-stealthsurf.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
