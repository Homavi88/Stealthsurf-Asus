name: Build and Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Unit tests
        run: |
          sh tools/test-protocols.sh
          sh tools/test-version-cli.sh
          sh tools/test-sync-fingerprint.sh
          sh tools/test-xrayui-detect.sh
          sh tools/test-routing-suggest.sh
          sh tools/test-settings.sh
          sh tools/test-deferred-apply.sh
          sh tools/test-update-progress.sh
          sh tools/test-update-atomic.sh
          sh tools/test-merlin-chrome.sh
          sh tools/test-service-event-hook.sh

      - name: Build and pack
        run: |
          npm run pack
          ls -la packaged/
          test -s packaged/asuswrt-merlin-stealthsurf.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: asuswrt-merlin-stealthsurf
          path: packaged/asuswrt-merlin-stealthsurf.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: asuswrt-merlin-stealthsurf
          path: packaged

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: packaged/asuswrt-merlin-stealthsurf.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: true
