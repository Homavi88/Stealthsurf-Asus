name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: tools/panel-httpd/go.mod
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - name: Build and pack
        run: |
          pnpm run pack
          test -s packaged/asuswrt-merlin-surfgate.tar.gz
          # Ensure version stamp and StealthSurf API module are present
          rm -rf /tmp/ss-ci-pkg && mkdir -p /tmp/ss-ci-pkg
          tar -xzf packaged/asuswrt-merlin-surfgate.tar.gz -C /tmp/ss-ci-pkg
          test -x /tmp/ss-ci-pkg/ssurf/stealthsurf
          test -f /tmp/ss-ci-pkg/ssurf/index.asp
          test -f /tmp/ss-ci-pkg/ssurf/app.js
          test -f /tmp/ss-ci-pkg/ssurf/panel/index.html
          test -f /tmp/ss-ci-pkg/ssurf/panel/app.js
          test -f /tmp/ss-ci-pkg/ssurf/index.panel.html
          # In-panel help (promo guide packaged under /help/)
          test -f /tmp/ss-ci-pkg/ssurf/panel/help/index.html
          test -f /tmp/ss-ci-pkg/ssurf/panel/help/screenshots/01-status-running.png
          grep -q './screenshots/' /tmp/ss-ci-pkg/ssurf/panel/help/index.html
          ! grep -q '../screenshots/' /tmp/ss-ci-pkg/ssurf/panel/help/index.html
          grep -q 'PanelHelp\|section === .help.\|справка' /tmp/ss-ci-pkg/ssurf/panel/app.js
          test -f docs/promo/index.html
          # Must NOT unpack into stealthsurf/ (official VPN path)
          test ! -e /tmp/ss-ci-pkg/stealthsurf
          grep -q 'XRAYUI_VERSION="1.4.18"' /tmp/ss-ci-pkg/ssurf/stealthsurf
          grep -q 'del(.reverse)' /tmp/ss-ci-pkg/ssurf/stealthsurf
          grep -q 'ssImportConfigs' /tmp/ss-ci-pkg/ssurf/panel/app.js
          grep -q 'ADDON_TITLE="SurfGate"' /tmp/ss-ci-pkg/ssurf/stealthsurf
          grep -q 'ADDON_JFFS_ADN_DIR="/jffs/addons/$ADDON_PKG_NAME"\|ADDON_PKG_NAME="ssurf"' /tmp/ss-ci-pkg/ssurf/stealthsurf
          grep -q 'OFFICIAL_SS_DAEMON' /tmp/ss-ci-pkg/ssurf/stealthsurf
          grep -q 'panel_start' /tmp/ss-ci-pkg/ssurf/stealthsurf
          grep -q 'PANEL_DEFAULT_PORT=1131' /tmp/ss-ci-pkg/ssurf/stealthsurf
          grep -q '__SS_PANEL__' /tmp/ss-ci-pkg/ssurf/panel/index.html
          grep -q 'SurfGate' /tmp/ss-ci-pkg/ssurf/panel/index.html
          grep -q 'available-servers' /tmp/ss-ci-pkg/ssurf/app.js
          grep -q 'Manage' /tmp/ss-ci-pkg/ssurf/app.js
          grep -q '_ss_location_code\|catalogLocationLabel\|locations' /tmp/ss-ci-pkg/ssurf/app.js
          grep -q 'geodata_is_list_file' /tmp/ss-ci-pkg/ssurf/stealthsurf
          sh tests/backend/geodata_sanitize.spec.sh
          sh tests/backend/vpn_hardening.spec.sh
          sh tests/backend/net_tests.spec.sh
          sh tests/backend/backup.spec.sh
          grep -q 'speedtest_run' /tmp/ss-ci-pkg/ssurf/stealthsurf
          grep -q 'dnstest_run' /tmp/ss-ci-pkg/ssurf/stealthsurf
          grep -q 'stealthsurf_speedtest' /tmp/ss-ci-pkg/ssurf/panel/app.js
          grep -q 'stealthsurf_dnstest' /tmp/ss-ci-pkg/ssurf/panel/app.js
          grep -q 'ADDON_USER_SCRIPTS_DIR' /tmp/ss-ci-pkg/ssurf/stealthsurf
          grep -q 'backup_tar_validate' /tmp/ss-ci-pkg/ssurf/stealthsurf
          grep -q 'bak restore' /tmp/ss-ci-pkg/ssurf/stealthsurf
          grep -q 'vpn_guest_force_nets\|vpn_split_rules_sync' /tmp/ss-ci-pkg/ssurf/stealthsurf
          grep -q 'vpn_lock_rules_sync\|vpn_service_lock_apply\|surfgate-vpn-lock' /tmp/ss-ci-pkg/ssurf/stealthsurf
          grep -q 'cron_speedtest_add\|CRU_SPEEDTEST_ID' /tmp/ss-ci-pkg/ssurf/stealthsurf
          grep -q 'split_bypass_domains\|split_lock_domains\|speedtest_interval' /tmp/ss-ci-pkg/ssurf/stealthsurf
          grep -q 'webrtc_hint\|ipv6_leaked' /tmp/ss-ci-pkg/ssurf/stealthsurf
          grep -q 'split_bypass_domains\|split_lock_domains\|speedtest_interval' /tmp/ss-ci-pkg/ssurf/panel/app.js
          test -f docs/qa-router.md
          sh -n /tmp/ss-ci-pkg/ssurf/stealthsurf
          grep -q 'ensure_xray_scaffold' /tmp/ss-ci-pkg/ssurf/stealthsurf
          grep -q 'stealthsurf-default' /tmp/ss-ci-pkg/ssurf/stealthsurf
          grep -q 'ss_api_import_finalize' /tmp/ss-ci-pkg/ssurf/stealthsurf
          grep -q 'ss_api_refresh_outbound_batch' /tmp/ss-ci-pkg/ssurf/stealthsurf
          grep -q 'ss_api_autofit_config' /tmp/ss-ci-pkg/ssurf/stealthsurf
          grep -q 'ss_api_update_settings' /tmp/ss-ci-pkg/ssurf/stealthsurf
          grep -q 'ss_api_merge_extra_into_catalog' /tmp/ss-ci-pkg/ssurf/stealthsurf
          grep -q 'probe_hint_timeout' /tmp/ss-ci-pkg/ssurf/app.js
          grep -q 'xray.running' /tmp/ss-ci-pkg/ssurf/stealthsurf
          grep -q 'ss_refuse_if_xrayui' /tmp/ss-ci-pkg/ssurf/stealthsurf
          grep -q 'ss_refuse_if_official\|ss_refuse_if_dataplane_conflict' /tmp/ss-ci-pkg/ssurf/stealthsurf
          grep -q 'stealthsurf-routerd' /tmp/ss-ci-pkg/ssurf/stealthsurf
          grep -q 'ss-conflict-banner' /tmp/ss-ci-pkg/ssurf/app.js
          grep -q 'official_conflict_message' /tmp/ss-ci-pkg/ssurf/app.js
          test -f docs/screenshots/01-status-running.png
          test -f docs/screenshots/05-xrayui-conflict.png
          test -f docs/screenshots/08-settings-account.png
          test -f docs/screenshots/09-settings-connection.png
          test -f docs/screenshots/10-settings-outbounds.png
          test -f docs/screenshots/11-settings-engine.png
          test -f docs/screenshots/12-settings-logs.png
          test -f docs/screenshots/13-settings-clients.png
          test -f docs/screenshots/14-settings-updates.png
          grep -q 'SurfGate' README.md
          grep -q 'ss_cli_dispatch' /tmp/ss-ci-pkg/ssurf/stealthsurf
          grep -q 'surfgate' /tmp/ss-ci-pkg/ssurf/stealthsurf
          grep -q 'ssurf' /tmp/ss-ci-pkg/ssurf/stealthsurf
          grep -q 'XRAY_CONFIG_DIR="/opt/etc/xray/$ADDON_TAG"' /tmp/ss-ci-pkg/ssurf/stealthsurf
          grep -q 'tproxy_mark=0x20000' /tmp/ss-ci-pkg/ssurf/stealthsurf
          grep -q 'ss_api_fetch_balances' /tmp/ss-ci-pkg/ssurf/stealthsurf
          grep -q 'ss_api_stamp_outbounds_from_catalog' /tmp/ss-ci-pkg/ssurf/stealthsurf
          grep -q 'ss_api_ensure_dns_leak' /tmp/ss-ci-pkg/ssurf/stealthsurf
          grep -q 'ss_api_apply_provider_connection_changes' /tmp/ss-ci-pkg/ssurf/stealthsurf
          grep -q 'cron_ss_catalog_sync_add' /tmp/ss-ci-pkg/ssurf/stealthsurf
          grep -q 'ss_catalog_auto_sync' /tmp/ss-ci-pkg/ssurf/stealthsurf
          grep -q '_ss_title' /tmp/ss-ci-pkg/ssurf/stealthsurf
          grep -qE 'ssSetKey|api.stealthsurf.net|ownCustomSettings|ext:stealthsurf' /tmp/ss-ci-pkg/ssurf/app.js
          grep -q 'ssAutofit\|ssUpdateSettings' /tmp/ss-ci-pkg/ssurf/app.js
          grep -q 'ss_catalog_auto_sync' /tmp/ss-ci-pkg/ssurf/app.js
          grep -q 'page:stealthsurf' /tmp/ss-ci-pkg/ssurf/index.asp
          grep -q 'isStandalonePanel\|/cgi-bin/api' /tmp/ss-ci-pkg/ssurf/app.js
          sh tests/backend/scaffold.spec.sh
          sh tests/backend/ss_catalog_sync.spec.sh
          sh tests/backend/ss_catalog_enrich.spec.sh
          sh tests/backend/test-xrayui-detect.sh
          sh tests/backend/test-official-detect.sh
          sh tests/backend/test-legacy-reverse-strip.sh
          sh tests/backend/test-coexistence.sh
          sh tests/backend/test-official-path.sh
          sh tests/backend/test-panel-httpd.sh
          grep -q 'panel_busybox_has_httpd\|panel_ensure_httpd' /tmp/ss-ci-pkg/ssurf/stealthsurf
          grep -q 'panel_find_lighttpd\|panel_start_lighttpd' /tmp/ss-ci-pkg/ssurf/stealthsurf
          test -x /tmp/ss-ci-pkg/ssurf/bin/panel-httpd.aarch64
          test -x /tmp/ss-ci-pkg/ssurf/bin/panel-httpd.armv7
          grep -q 'panel_bundled_httpd\|panel_start_bundled' /tmp/ss-ci-pkg/ssurf/stealthsurf
          grep -q 'is_ss_numeric_tag\|strip_ss_tag_prefix' /tmp/ss-ci-pkg/ssurf/stealthsurf
          ! grep -E 'test\("\^ss-|sub\("\^ss-' /tmp/ss-ci-pkg/ssurf/stealthsurf
          grep -q 'tun_table=251' /tmp/ss-ci-pkg/ssurf/stealthsurf
          grep -q 'dnsmasq_strip_addon_block' /tmp/ss-ci-pkg/ssurf/stealthsurf
          grep -q '10185' /tmp/ss-ci-pkg/ssurf/stealthsurf
