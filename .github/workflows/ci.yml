name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - name: Build and pack
        run: |
          pnpm run pack
          test -s packaged/asuswrt-merlin-stealthsurf.tar.gz
          # Ensure version stamp and StealthSurf API module are present
          rm -rf /tmp/ss-ci-pkg && mkdir -p /tmp/ss-ci-pkg
          tar -xzf packaged/asuswrt-merlin-stealthsurf.tar.gz -C /tmp/ss-ci-pkg
          test -x /tmp/ss-ci-pkg/stealthsurf/stealthsurf
          test -f /tmp/ss-ci-pkg/stealthsurf/index.asp
          test -f /tmp/ss-ci-pkg/stealthsurf/app.js
          grep -q 'XRAYUI_VERSION="1.1.10"' /tmp/ss-ci-pkg/stealthsurf/stealthsurf
          grep -q 'geodata_is_list_file' /tmp/ss-ci-pkg/stealthsurf/stealthsurf
          sh tests/backend/geodata_sanitize.spec.sh
          sh -n /tmp/ss-ci-pkg/stealthsurf/stealthsurf
          grep -q 'ensure_xray_scaffold' /tmp/ss-ci-pkg/stealthsurf/stealthsurf
          grep -q 'stealthsurf-default' /tmp/ss-ci-pkg/stealthsurf/stealthsurf
          grep -q 'ss_api_import_finalize' /tmp/ss-ci-pkg/stealthsurf/stealthsurf
          grep -q 'xray.running' /tmp/ss-ci-pkg/stealthsurf/stealthsurf
          grep -q 'ss_refuse_if_xrayui' /tmp/ss-ci-pkg/stealthsurf/stealthsurf
          grep -q 'ss-conflict-banner' /tmp/ss-ci-pkg/stealthsurf/app.js
          test -f docs/screenshots/01-status-running.png
          test -f docs/screenshots/05-xrayui-conflict.png
          grep -q 'ss_cli_dispatch' /tmp/ss-ci-pkg/stealthsurf/stealthsurf
          grep -q 'ssurf' /tmp/ss-ci-pkg/stealthsurf/stealthsurf
          grep -q 'XRAY_CONFIG_DIR="/opt/etc/xray/$ADDON_TAG"' /tmp/ss-ci-pkg/stealthsurf/stealthsurf
          grep -q 'tproxy_mark=0x20000' /tmp/ss-ci-pkg/stealthsurf/stealthsurf
          grep -q 'ss_api_fetch_balances' /tmp/ss-ci-pkg/stealthsurf/stealthsurf
          grep -q 'ss_api_stamp_outbounds_from_catalog' /tmp/ss-ci-pkg/stealthsurf/stealthsurf
          grep -q 'ss_api_ensure_dns_leak' /tmp/ss-ci-pkg/stealthsurf/stealthsurf
          grep -q 'ss_api_apply_provider_connection_changes' /tmp/ss-ci-pkg/stealthsurf/stealthsurf
          grep -q 'cron_ss_catalog_sync_add' /tmp/ss-ci-pkg/stealthsurf/stealthsurf
          grep -q 'ss_catalog_auto_sync' /tmp/ss-ci-pkg/stealthsurf/stealthsurf
          grep -q '_ss_title' /tmp/ss-ci-pkg/stealthsurf/stealthsurf
          grep -qE 'ssSetKey|api.stealthsurf.net|ownCustomSettings|ext:stealthsurf' /tmp/ss-ci-pkg/stealthsurf/app.js
          grep -q 'ss_catalog_auto_sync' /tmp/ss-ci-pkg/stealthsurf/app.js
          grep -q 'page:stealthsurf' /tmp/ss-ci-pkg/stealthsurf/index.asp
          sh tests/backend/scaffold.spec.sh
          sh tests/backend/ss_catalog_sync.spec.sh
          sh tests/backend/test-xrayui-detect.sh
