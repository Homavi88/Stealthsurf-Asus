<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Cache-Control" content="no-cache" />
    <meta name="theme-color" content="#0b0f14" />
    <title>SurfGate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0b0f14;
        color: #e6e8eb;
        font-family: 'IBM Plex Sans', 'Segoe UI', 'Helvetica Neue', sans-serif;
      }
      #ss-panel-boot {
        max-width: 28rem;
        margin: 20vh auto 0;
        padding: 1.5rem;
        text-align: left;
        opacity: 0.95;
      }
      #ss-panel-boot .brand {
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-size: 1.15rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #3db8ff;
      }
      #ss-panel-boot .hint {
        margin-top: 0.55rem;
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-size: 0.8rem;
        color: #8b939e;
      }
      #ss-panel-boot[hidden] {
        display: none;
      }
      #ss-panel-boot .err {
        color: #ff5c5c;
        margin-top: 1rem;
        white-space: pre-wrap;
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-size: 0.8rem;
      }
      #Loading.popup_bg {
        position: fixed;
        inset: 0;
        z-index: 10040;
        display: none;
        align-items: center;
        justify-content: center;
        padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
        box-sizing: border-box;
        background: rgba(5, 8, 12, 0.78);
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
        color: #e6e8eb;
        font-family: 'IBM Plex Sans', 'Segoe UI', sans-serif;
        text-align: center;
        pointer-events: none;
      }
      #Loading.popup_bg.is-visible {
        display: flex !important;
        visibility: visible !important;
        pointer-events: auto;
      }
      #Loading .ss-load-card {
        width: min(360px, 100%);
        margin: 0 auto;
        padding: 20px 18px 16px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: linear-gradient(180deg, #1a222e 0%, #121820 100%);
        box-shadow: 0 20px 48px rgba(0, 0, 0, 0.55);
        text-align: left;
      }
      #Loading #proceeding_main_txt,
      #Loading .ss-load-msg {
        font-family: 'IBM Plex Sans', 'Segoe UI', sans-serif;
        font-size: 0.95rem;
        font-weight: 600;
        line-height: 1.35;
        color: #e6e8eb;
        word-break: break-word;
      }
      #Loading #proceeding_txt,
      #Loading .ss-load-pct {
        margin-top: 10px;
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-size: 0.85rem;
        color: #3db8ff;
        letter-spacing: 0.02em;
      }
      #Loading .ss-load-bar {
        margin-top: 14px;
        height: 6px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      #Loading .ss-load-bar__fill {
        height: 100%;
        width: 0%;
        border-radius: inherit;
        background: linear-gradient(90deg, #2a9fd8, #3db8ff);
        transition: width 0.25s ease;
      }
      @media (max-width: 640px) {
        #Loading.popup_bg {
          align-items: flex-start;
          padding-top: max(72px, calc(env(safe-area-inset-top) + 56px));
        }
        #Loading .ss-load-card {
          width: 100%;
        }
      }
    </style>
  </head>
  <body class="ss-standalone-panel">
    <div id="ss-panel-boot">
      <div class="brand">SurfGate</div>
      <div class="hint">loading panel…</div>
      <div id="ss-panel-boot-err" class="err" hidden></div>
    </div>

    <div id="Loading" class="popup_bg" style="visibility: hidden; display: none" aria-hidden="true">
      <div id="loadingBlock" class="ss-load-card" role="status" aria-live="polite">
        <div id="proceeding_main_txt" class="ss-load-msg"></div>
        <div class="ss-load-bar" aria-hidden="true">
          <div id="ss-load-bar-fill" class="ss-load-bar__fill"></div>
        </div>
        <div id="proceeding_txt" class="ss-load-pct"></div>
      </div>
    </div>
    <div id="overDiv" style="position: absolute; visibility: hidden; z-index: 10000"></div>

    <div id="stealthsurf-app"></div>
    <div id="stealthsurf-modals"></div>

    <script>
      window.__SS_PANEL__ = true;
      window.xray = {
        router: { name: '', firmware: '', language: 'ru', ip: '', features: '', devices_online: {}, devices: {} },
        server: { isRunning: false, b4sni_isRunning: false },
        custom_settings: {}
      };
      window.OFFSETX = 8;
      window.OFFSETY = 8;
      window.RIGHT = 2;
      window.LEFT = 1;
      window.DELAY = 4;
      window.WIDTH = 10;
      window.STICKY = 16;
      window.CAPTION = 1;
      window.show_menu = function () {};
      window.showtext = function (el, html) {
        if (el) el.innerHTML = html || '';
      };
      window.hideLoading = function () {
        var loading = document.getElementById('Loading');
        var fill = document.getElementById('ss-load-bar-fill');
        if (loading) {
          loading.classList.remove('is-visible');
          loading.style.visibility = 'hidden';
          loading.style.display = 'none';
          loading.style.pointerEvents = 'none';
          loading.setAttribute('aria-hidden', 'true');
        }
        if (fill) fill.style.width = '0%';
      };
      window.showLoading = function (_delay, flag) {
        var loading = document.getElementById('Loading');
        if (!loading) return;
        loading.classList.add('is-visible');
        loading.style.visibility = 'visible';
        loading.style.display = 'flex';
        loading.style.pointerEvents = 'auto';
        loading.setAttribute('aria-hidden', 'false');
        if (flag && typeof window.updateLoadingProgress === 'function') {
          try {
            window.updateLoadingProgress(flag);
          } catch (_e) {
            /* app.js may not have wired updateLoadingProgress yet */
          }
        }
      };
      window.overlib = function (msg) {
        var el = document.getElementById('overDiv');
        if (!el) return;
        el.innerHTML = msg || '';
        el.style.visibility = msg ? 'visible' : 'hidden';
      };

      (function bootstrap() {
        var errEl = document.getElementById('ss-panel-boot-err');
        var boot = document.getElementById('ss-panel-boot');
        function fail(msg) {
          if (errEl) {
            errEl.hidden = false;
            errEl.textContent = msg;
          }
        }
        fetch('/cgi-bin/bootstrap', { cache: 'no-store' })
          .then(function (r) {
            return r.text().then(function (t) {
              var data = null;
              try {
                data = t ? JSON.parse(t) : null;
              } catch (e) {
                data = null;
              }
              if (!r.ok) {
                var detail = (data && data.error) || t || '';
                detail = String(detail).replace(/\s+/g, ' ').slice(0, 160);
                throw new Error('bootstrap HTTP ' + r.status + (detail ? ' — ' + detail : ''));
              }
              return data;
            });
          })
          .then(function (data) {
            if (!data || !data.ok || !data.xray) throw new Error((data && data.error) || 'bad bootstrap');
            window.xray = data.xray;
            window.__SS_PANEL_META__ = data.panel || {};
            if (boot) boot.hidden = true;
            var s = document.createElement('script');
            s.type = 'module';
            s.src = './app.js';
            s.onerror = function () {
              fail('failed to load app.js');
            };
            document.body.appendChild(s);
          })
          .catch(function (e) {
            fail('panel bootstrap failed: ' + (e && e.message ? e.message : e));
          });
      })();
    </script>
  </body>
</html>
