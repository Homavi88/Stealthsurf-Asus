<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Cache-Control" content="no-cache" />
    <meta name="theme-color" content="#0b0f14" />
    <title>SurfGate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0b0f14;
        color: #e6e8eb;
        font-family: 'IBM Plex Sans', 'Segoe UI', 'Helvetica Neue', sans-serif;
      }
      #ss-panel-boot {
        max-width: 28rem;
        margin: 20vh auto 0;
        padding: 1.5rem;
        text-align: left;
        opacity: 0.95;
      }
      #ss-panel-boot .brand {
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-size: 1.15rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #3db8ff;
      }
      #ss-panel-boot .hint {
        margin-top: 0.55rem;
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-size: 0.8rem;
        color: #8b939e;
      }
      #ss-panel-boot[hidden] {
        display: none;
      }
      #ss-panel-boot .err {
        color: #ff5c5c;
        margin-top: 1rem;
        white-space: pre-wrap;
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-size: 0.8rem;
      }
      #Loading.popup_bg {
        pointer-events: none;
      }
      #Loading.popup_bg[style*='visible'] {
        pointer-events: auto;
      }
    </style>
  </head>
  <body class="ss-standalone-panel">
    <div id="ss-panel-boot">
      <div class="brand">SurfGate</div>
      <div class="hint">loading panel…</div>
      <div id="ss-panel-boot-err" class="err" hidden></div>
    </div>

    <div id="Loading" class="popup_bg" style="visibility: hidden">
      <table cellpadding="5" id="loadingBlock" class="loadingBlock" style="margin: auto; width: 100%; height: 100%">
        <tr>
          <td>
            <div id="proceeding_main_txt"></div>
            <div id="proceeding_txt" style="margin-top: 0.5rem"></div>
          </td>
        </tr>
      </table>
    </div>
    <div id="overDiv" style="position: absolute; visibility: hidden; z-index: 10000"></div>

    <div id="stealthsurf-app"></div>
    <div id="stealthsurf-modals"></div>

    <script>
      window.__SS_PANEL__ = true;
      window.xray = {
        router: { name: '', firmware: '', language: 'ru', ip: '', features: '', devices_online: {}, devices: {} },
        server: { isRunning: false, b4sni_isRunning: false },
        custom_settings: {}
      };
      window.OFFSETX = 8;
      window.OFFSETY = 8;
      window.RIGHT = 2;
      window.LEFT = 1;
      window.DELAY = 4;
      window.WIDTH = 10;
      window.STICKY = 16;
      window.CAPTION = 1;
      window.show_menu = function () {};
      window.showtext = function (el, html) {
        if (el) el.innerHTML = html || '';
      };
      window.hideLoading = function () {
        var loading = document.getElementById('Loading');
        if (loading) {
          loading.style.visibility = 'hidden';
          loading.style.display = 'none';
          loading.style.pointerEvents = 'none';
        }
      };
      window.showLoading = function () {};
      window.overlib = function (msg) {
        var el = document.getElementById('overDiv');
        if (!el) return;
        el.innerHTML = msg || '';
        el.style.visibility = msg ? 'visible' : 'hidden';
      };

      (function bootstrap() {
        var errEl = document.getElementById('ss-panel-boot-err');
        var boot = document.getElementById('ss-panel-boot');
        function fail(msg) {
          if (errEl) {
            errEl.hidden = false;
            errEl.textContent = msg;
          }
        }
        fetch('/cgi-bin/bootstrap', { cache: 'no-store' })
          .then(function (r) {
            return r.text().then(function (t) {
              var data = null;
              try {
                data = t ? JSON.parse(t) : null;
              } catch (e) {
                data = null;
              }
              if (!r.ok) {
                var detail = (data && data.error) || t || '';
                detail = String(detail).replace(/\s+/g, ' ').slice(0, 160);
                throw new Error('bootstrap HTTP ' + r.status + (detail ? ' — ' + detail : ''));
              }
              return data;
            });
          })
          .then(function (data) {
            if (!data || !data.ok || !data.xray) throw new Error((data && data.error) || 'bad bootstrap');
            window.xray = data.xray;
            window.__SS_PANEL_META__ = data.panel || {};
            if (boot) boot.hidden = true;
            var s = document.createElement('script');
            s.type = 'module';
            s.src = './app.js';
            s.onerror = function () {
              fail('failed to load app.js');
            };
            document.body.appendChild(s);
          })
          .catch(function (e) {
            fail('panel bootstrap failed: ' + (e && e.message ? e.message : e));
          });
      })();
    </script>
  </body>
</html>
